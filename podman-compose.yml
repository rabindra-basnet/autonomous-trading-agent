name: tradepulse-infra

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: tradepulse-postgres
    environment:
      POSTGRES_USER: tradepulse
      POSTGRES_PASSWORD: tradepulse
      POSTGRES_DB: tradepulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepulse -d tradepulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: tradepulse-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: