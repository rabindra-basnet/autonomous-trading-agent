[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-trading-agent"
version = "0.1.0"
description = "Provider-agnostic, self-improving autonomous AI trading agent platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "duckdb>=0.10.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "websockets>=12.0",
    "ccxt>=4.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "arq>=0.28.0",
    "openai>=3.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

# ----------------------------------------------------------------------
# Hatchling Build & Package Target Configuration
# ----------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

# ----------------------------------------------------------------------
# Pytest Runtime Import Configuration
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# ----------------------------------------------------------------------
# Linter & Type-Checker Import Path Configuration
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["app"]
ignore_missing_imports = true

[tool.ruff]
src = [".", "app"]
line-length = 120

[tool.ruff.lint]
# The IO/resilience layer intentionally uses defensive patterns:
# - BLE001: per-provider failures are caught and logged instead of crashing the loop.
# - S110: silent teardown / idempotent setup (e.g. consumer-group already exists).
# - TRY401: `logger.exception` already embeds the traceback; extra {e} is cosmetic.
ignore = ["BLE001", "S110", "TRY401"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
