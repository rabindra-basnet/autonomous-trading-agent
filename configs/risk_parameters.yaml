risk:
  initial_capital: 100000.0
  max_position_size_pct: 0.20        # Max 20% of capital in any single asset
  max_portfolio_exposure_pct: 0.80   # Max 80% capital allocated in total
  max_drawdown_limit_pct: 0.10       # Circuit breaker triggers at 10% drawdown
  max_single_trade_risk_pct: 0.02    # Risk at most 2% capital per trade
  default_stop_loss_pct: 0.03        # 3% stop loss
  default_take_profit_pct: 0.06      # 6% take profit
  max_open_orders: 10
  slippage_model:
    fixed_basis_points: 5.0          # 0.05% slippage estimate
  commission_rate: 0.001             # 0.10% commission per trade
