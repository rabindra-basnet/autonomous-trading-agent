market_data:
  default_provider: "ccxt"
  ccxt:
    exchange_id: "binance"
    enable_rate_limit: true
    timeout_ms: 10000
    sandbox: false
    symbols:
      - "BTC/USDT"
      - "ETH/USDT"
      - "SOL/USDT"
  simulated:
    seed: 42
    drift: 0.0002
    volatility: 0.015

news:
  default_provider: "gdelt"
  gdelt:
    query_keywords: ["bitcoin", "crypto", "ethereum", "fed", "inflation"]
    max_records: 50
    update_interval_seconds: 300
  rss:
    feeds:
      - "https://cointelegraph.com/rss"
      - "https://www.coindesk.com/arc/outboundfeeds/rss/"

social:
  default_provider: "reddit"
  reddit:
    subreddits: ["cryptocurrency", "bitcoin", "ethereum", "solana"]
    fetch_limit: 50
    update_interval_seconds: 180

macro:
  default_provider: "fred"
  fred:
    api_key_env: "FRED_API_KEY"
    series:
      - id: "FEDFUNDS"
        name: "Federal Funds Effective Rate"
      - id: "T10Y2Y"
        name: "10-Year Treasury Yield Spread"
      - id: "CPIAUCSL"
        name: "Consumer Price Index"

onchain:
  default_provider: "defillama"
  defillama:
    protocols: ["ethereum", "solana", "binance"]
    update_interval_seconds: 600
